<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Hover Effect (Three.js)</title>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create card geometry
        const geometry = new THREE.BoxGeometry(3, 4, 0.2);
        const material = new THREE.MeshStandardMaterial({ color: 0xff9a9e, metalness: 0.5, roughness: 0.3 });
        const card = new THREE.Mesh(geometry, material);
        scene.add(card);

        // Lights
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(5, 5, 5);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // Position camera
        camera.position.z = 5;

        // Mouse move event
        document.addEventListener("mousemove", (event) => {
            let xAxis = (window.innerWidth / 2 - event.clientX) / 100;
            let yAxis = (window.innerHeight / 2 - event.clientY) / 100;
            gsap.to(card.rotation, { y: xAxis, x: yAxis, duration: 0.5 });
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
